[project]
name = "interval-logic"
version = "0.3.0"
description = "Interval formulas and complete-trajectory trace semantics"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "portion>=2.6.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interval_logic", "src/protocol"]

[dependency-groups]
dev = []
notebooks = ["plotly", "ipykernel", "nbformat", "nbclient"]
